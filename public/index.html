<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <title>KING MD — WhatsApp Pairing</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 10%,#183a32 0,transparent 38%),#080b10;color:#f4f7f6;font:16px system-ui,Arial}.card{width:min(100%,440px);padding:28px;border:1px solid #24473e;border-radius:22px;background:#101915;box-shadow:0 20px 70px #0009}h1{margin:0 0 8px;font-size:30px;letter-spacing:1px}p{color:#aabbb4;line-height:1.5}.tag{color:#5ee6a8;font-size:12px;letter-spacing:2px;font-weight:800}label{display:block;margin:22px 0 8px;color:#d9e6df}input{width:100%;padding:15px;border:1px solid #34584c;border-radius:12px;background:#080e0b;color:white;font-size:17px;outline:none}button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:#39d98a;color:#052015;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.result{display:none;margin-top:20px;padding:18px;border-radius:12px;background:#07120d;border:1px dashed #39d98a;text-align:center}.code{font-size:28px;letter-spacing:5px;font-weight:900;color:#6fffb5;overflow-wrap:anywhere}.status{min-height:24px;margin-top:14px;color:#b9c9c1;font-size:14px}.small{font-size:12px;color:#82958b;margin-top:20px}
  </style>
</head>
<body>
  <main class="card">
    <div class="tag">WHATSAPP MULTI-DEVICE</div>
    <h1>KING MD</h1>
    <p>Enter your WhatsApp number with country code. Do not include a plus sign, spaces or dashes.</p>
    <form id="pairForm">
      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="2547XXXXXXXX" minlength="8" maxlength="15" required>
      <button id="submit" type="submit">GET PAIRING CODE</button>
    </form>
    <div class="result" id="result"><div>YOUR WHATSAPP PAIRING CODE</div><div class="code" id="code"></div><button type="button" id="copy">COPY CODE</button></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="small">Open WhatsApp → Linked devices → Link a device → Link with phone number.</div>
  </main>
  <script src="/pair.js"></script>
</body>
</html>
